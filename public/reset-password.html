<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - 60Seconds</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 16px;
        color: #ccc;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .label {
        display: block;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .input {
        width: 100%;
        background: #333;
        border: 1px solid #555;
        border-radius: 12px;
        padding: 16px;
        font-size: 16px;
        color: #fff;
        outline: none;
      }

      .input:focus {
        border-color: #007aff;
      }

      .button {
        width: 100%;
        background: #007aff;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        margin-top: 20px;
      }

      .button:hover {
        background: #0056cc;
      }

      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .back-button {
        width: 100%;
        background: #666;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        margin-top: 10px;
      }

      .back-button:hover {
        background: #555;
      }

      .success {
        text-align: center;
        padding: 20px;
        background: #1a4d1a;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .error {
        text-align: center;
        padding: 20px;
        background: #4d1a1a;
        border-radius: 12px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your new password below</p>
      </div>

      <div id="status"></div>

      <form id="resetForm">
        <div class="form-group">
          <label class="label" for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            class="input"
            placeholder="Enter new password"
            required
          />
        </div>

        <div class="form-group">
          <label class="label" for="confirmPassword"
            >Confirm New Password</label
          >
          <input
            type="password"
            id="confirmPassword"
            class="input"
            placeholder="Confirm new password"
            required
          />
        </div>

        <button type="submit" class="button" id="resetButton">
          Reset Password
        </button>
      </form>

      <button class="back-button" onclick="goBack()">Go Back to Sign In</button>
    </div>

    <script src="/runtime-config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
      const supabaseUrl = window.__PUBLIC_CONFIG__.supabaseUrl;
      const supabaseKey = window.__PUBLIC_CONFIG__.supabaseAnonKey;
      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      const urlParams = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = urlParams.get("access_token");
      const refreshToken = urlParams.get("refresh_token");

      if (!accessToken || !refreshToken) {
        showStatus(
          "No reset token found. Please request a new password reset.",
          "error"
        );
      }

      function showStatus(message, type = "info") {
        const statusDiv = document.getElementById("status");
        statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
      }

      function validatePassword(password) {
        const minLength = password.length >= 8;
        const hasUpperCase = /[A-Z]/.test(password);
        const hasLowerCase = /[a-z]/.test(password);
        const hasNumbers = /\d/.test(password);
        const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

        return {
          isValid:
            minLength &&
            hasUpperCase &&
            hasLowerCase &&
            hasNumbers &&
            hasSpecialChar,
          minLength,
          hasUpperCase,
          hasLowerCase,
          hasNumbers,
          hasSpecialChar,
        };
      }

      // Handle form submission
      document
        .getElementById("resetForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const resetButton = document.getElementById("resetButton");

          // Validation
          if (!newPassword || !confirmPassword) {
            showStatus("Please fill in all fields", "error");
            return;
          }

          if (newPassword !== confirmPassword) {
            showStatus("Passwords do not match", "error");
            return;
          }

          const passwordValidation = validatePassword(newPassword);
          if (!passwordValidation.isValid) {
            showStatus(
              "Password must be at least 8 characters long and contain uppercase, lowercase, numbers, and special characters.",
              "error"
            );
            return;
          }

          // Disable button
          resetButton.disabled = true;
          resetButton.textContent = "Resetting...";

          try {
            // Set the session using the tokens from the URL
            const { data: sessionData, error: sessionError } =
              await supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken,
              });

            if (sessionError) {
              showStatus(
                "Invalid or expired reset link. Please request a new password reset.",
                "error"
              );
              return;
            }

            // Update the password
            const { data: updateData, error: updateError } =
              await supabase.auth.updateUser({
                password: newPassword,
              });

            if (updateError) {
              showStatus(
                "Failed to update password: " + updateError.message,
                "error"
              );
              return;
            }

            showStatus(
              "Password reset successful! You can now sign in with your new password.",
              "success"
            );

            // Clear form
            document.getElementById("newPassword").value = "";
            document.getElementById("confirmPassword").value = "";
          } catch (error) {
            showStatus(
              "An unexpected error occurred. Please try again.",
              "error"
            );
          } finally {
            resetButton.disabled = false;
            resetButton.textContent = "Reset Password";
          }
        });

      // Go back function
      function goBack() {
        window.location.href = "/signin";
      }
    </script>
  </body>
</html>
