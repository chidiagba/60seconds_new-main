<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - 60Seconds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .status-message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #00d4ff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-button {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .back-button:hover {
            background: #00d4ff;
            color: #1a1a1a;
        }

        .ceo-signature {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-style: italic;
            color: #b0b0b0;
        }

        .ceo-name {
            color: #00d4ff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">60Seconds</div>
        <h1 class="title">Email Verification</h1>
        <p class="subtitle">Verifying your email address...</p>
        
        <div id="status" class="status-message" style="display: none;"></div>
        <div id="spinner" class="spinner"></div>

        <button class="back-button" onclick="goBack()">
            Back to Sign In
        </button>

        <div class="ceo-signature">
            <p>Welcome to the 60Seconds community!</p>
            <p>Best regards,<br>
            <span class="ceo-name">CEO of 60Seconds</span></p>
        </div>
    </div>

    <script src="/runtime-config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script>
        // Initialize Supabase client
        const supabaseUrl = window.__PUBLIC_CONFIG__.supabaseUrl;
        const supabaseKey = window.__PUBLIC_CONFIG__.supabaseAnonKey;
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = urlParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token');
        const type = urlParams.get('type');

        // Show status
        function showStatus(message, statusType = 'info') {
            const statusDiv = document.getElementById('status');
            const spinner = document.getElementById('spinner');
            
            statusDiv.innerHTML = message;
            statusDiv.className = `status-message ${statusType}`;
            statusDiv.style.display = 'block';
            spinner.style.display = 'none';
        }

        // Handle email verification
        async function handleEmailVerification() {
            if (!accessToken || !refreshToken || type !== 'signup') {
                showStatus('Invalid verification link. Please request a new verification email.', 'error');
                return;
            }

            try {
                // Set the session using the tokens from the URL
                const { data: sessionData, error: sessionError } = await supabase.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });

                if (sessionError) {
                    showStatus('Invalid or expired verification link. Please request a new verification email.', 'error');
                    return;
                }

                // Check if email is already verified
                if (sessionData.user?.email_confirmed_at) {
                    showStatus('Your email has been successfully verified! You can now sign in to your account.', 'success');
                } else {
                    showStatus('Email verification completed! You can now sign in to your account.', 'success');
                }

            } catch (error) {
                showStatus('An unexpected error occurred during verification. Please try again.', 'error');
            }
        }

        // Go back function
        function goBack() {
            window.location.href = '/signin';
        }

        // Start verification process
        handleEmailVerification();
    </script>
</body>
</html>
