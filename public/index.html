<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>%WEB_TITLE%</title>
  <meta name="description" content="Discover events, buy tickets and products, and reserve table seats with 60seconds." />
  <meta name="theme-color" content="#111111" />
  <style>html,body,#root{width:100%;min-height:100%;margin:0}html,body{height:100%;background:#111}#root{display:flex;flex:1}body{overflow:hidden}</style>
</head>
<body>
  <noscript>Please enable JavaScript to view this event and book tickets or tables.</noscript>
  <div id="root"></div>
  <script>
    // Preserve existing email links without redirecting ordinary event URLs.
    var params = new URLSearchParams(window.location.hash.slice(1));
    if (params.get('access_token') && params.get('refresh_token')) {
      if (params.get('type') === 'recovery') window.location.replace('/reset-password.html' + window.location.hash);
      if (params.get('type') === 'signup') window.location.replace('/verify-email.html' + window.location.hash);
    }
  </script>
</body>
</html>
